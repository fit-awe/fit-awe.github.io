name: Monthly publications and translations
on:
  schedule:
    # First day of each month, 09:17 Asia/Shanghai (GitHub schedules use UTC).
    - cron: '17 1 1 * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: monthly-site-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install maintenance dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Test update safeguards
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Check DBLP and Google Scholar
        run: python scripts/update_publications.py
      - name: Translate and review new English content
        env:
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          TRANSLATION_MODEL: ${{ vars.TRANSLATION_MODEL || 'kimi-k2.5' }}
          TRANSLATION_BASE_URL: ${{ vars.TRANSLATION_BASE_URL || 'https://api.moonshot.cn/v1' }}
        run: python scripts/translate_locales.py
      - name: Generate all five languages and validate
        run: |
          python scripts/build_site.py
          python scripts/check_publications.py
          python scripts/check_locales.py
          python scripts/check_content.py
          python scripts/check_images.py
      - name: Commit verified updates
        id: commit
        run: |
          git add data images/optimized '*.html'
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update publications and synchronized translations'
            git push
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Request the GitHub Pages build after a bot commit
        if: steps.commit.outputs.changed == 'true' && github.repository == 'fit-awe/fit-awe.github.io'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.status'
      - name: Notify deployment integration when configured
        if: steps.commit.outputs.changed == 'true'
        env:
          KIMI_DEPLOY_HOOK_URL: ${{ secrets.KIMI_DEPLOY_HOOK_URL }}
        run: python scripts/notify_deployment.py
      - name: Publish source status in run summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=Path('reports/publication-update.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
            summary.write('## Monthly website update\n\n')
            if report.exists():
              data=json.loads(report.read_text())
              summary.write('New publications: '+str(len(data['added']))+'\n\n')
              for source,status in data['sources'].items():
                summary.write('- '+source+': '+status['status']+'\n')
                if status['status']!='ok': print('::warning::'+source+' unavailable; retained existing records. See update report.')
              summary.write('\nUnverified Scholar candidates: '+str(len(data['pending']))+'\n')
            else: summary.write('No source report produced; inspect failed steps.\n')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: monthly-update-report
          path: reports/
          retention-days: 90
          if-no-files-found: ignore
